name: CI

on:
  push:
    branches: [main]
  pull_request:

# self-hosted runner にも渡る GITHUB_TOKEN を読み取り専用に絞る
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        run: ./gradlew build

      # main への push 時のみ、自宅サーバーへのデプロイ用に成果物を渡す
      - name: Upload deploy artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: rss-watch-deploy
          path: |
            build/libs/rss-watch.jar
            feeds.toml
          retention-days: 3
          if-no-files-found: error

  # 自宅サーバー常駐の self-hosted runner が jar を配置してサービスを再起動する。
  # セットアップ手順は README の「自動デプロイ」参照。
  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: self-hosted
    concurrency:
      group: deploy-home-server
      cancel-in-progress: false
    steps:
      - name: Download deploy artifact
        uses: actions/download-artifact@v4
        with:
          name: rss-watch-deploy

      - name: Deploy jar and restart service
        # 稼働中の jar を直接上書きしない: 同一 FS に置いてから mv でアトミックに差し替え、
        # 直前の jar は .prev として残す(起動不能時に手で戻せるように)
        run: |
          cp build/libs/rss-watch.jar /opt/rss-watch/rss-watch.jar.new
          if [ -f /opt/rss-watch/rss-watch.jar ]; then
            cp -p /opt/rss-watch/rss-watch.jar /opt/rss-watch/rss-watch.jar.prev
          fi
          mv /opt/rss-watch/rss-watch.jar.new /opt/rss-watch/rss-watch.jar
          cp feeds.toml /opt/rss-watch/feeds.toml
          sudo systemctl restart rss-watch

      - name: Verify service is up
        # Access JWT 検証が有効だとローカルからは 401 が返るため、
        # ステータスコードは問わず「HTTP 応答が返ること」を起動成功とみなす
        run: |
          for _ in $(seq 1 12); do
            if curl -s -o /dev/null --max-time 5 http://localhost:8080/; then
              echo "service is responding"
              exit 0
            fi
            sleep 5
          done
          echo "service did not respond within 60s"
          systemctl status rss-watch --no-pager || true
          exit 1
