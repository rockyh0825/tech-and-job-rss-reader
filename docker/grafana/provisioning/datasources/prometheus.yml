# Prometheus datasource の provisioning(手動セットアップゼロでリポジトリ管理)
apiVersion: 1

datasources:
  - name: Prometheus
    # ダッシュボード JSON(rss-watch.json)から固定 uid で参照する
    uid: prometheus
    type: prometheus
    access: proxy
    # compose 内 DNS でコンテナ名解決(Grafana コンテナ → Prometheus コンテナ)
    url: http://prometheus:9090
    isDefault: true
    editable: false
