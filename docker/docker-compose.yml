# ディレクトリ名(docker)由来のプロジェクト名だと他リポジトリと衝突するため明示する
name: rss-watch

services:
  kafka:
    image: apache/kafka:3.9.1
    container_name: rss-watch-kafka
    ports:
      # 認証なし PLAINTEXT のため LAN に露出しないようループバック限定で bind
      - "127.0.0.1:9092:9092"
    environment:
      # KRaft モード(シングルノードで broker + controller を兼任)
      # イメージのデフォルト値に依存しないよう CLUSTER_ID を固定(kafka-storage.sh random-uuid で生成)
      CLUSTER_ID: bNOKlPo8R0Gn-Evx3rNT8w
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      # INTERNAL: コンテナ間(kafka-ui など)/ EXTERNAL: ホスト上のアプリ(bootRun)
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      # シングルブローカーのためレプリケーション系はすべて 1
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      # topic は kafka-init が明示的に作成する(暗黙の自動作成は無効化)
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      # KAFKA_* 指定時は env 由来のプロパティのみで server.properties が生成されるため、
      # log.dirs を明示しないと /tmp/kafka-logs に書かれ named volume に永続化されない
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:29092 > /dev/null 2>&1",
        ]
      interval: 30s
      timeout: 10s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  # 起動時に topic rss.items を自動作成するワンショットジョブ
  # (key = フィード名のパーティショニングを観察できるよう 3 パーティション)
  kafka-init:
    image: apache/kafka:3.9.1
    container_name: rss-watch-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint:
      [
        "/opt/kafka/bin/kafka-topics.sh",
        "--bootstrap-server",
        "kafka:29092",
        "--create",
        "--if-not-exists",
        "--topic",
        "rss.items",
        "--partitions",
        "3",
        "--replication-factor",
        "1",
      ]
    restart: "no"

  postgres:
    image: postgres:17-alpine
    container_name: rss-watch-postgres
    ports:
      # 認証はローカル用デフォルト値のため LAN に露出しないようループバック限定で bind
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: rsswatch
      POSTGRES_USER: rsswatch
      # ループバック限定 bind のため秘匿性は要求しない(compose 内デフォルト値)
      POSTGRES_PASSWORD: rsswatch
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rsswatch -d rsswatch"]
      interval: 30s
      timeout: 10s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:v1.3.0
    container_name: rss-watch-kafka-ui
    ports:
      # 管理 UI を LAN に露出しないようループバック限定で bind
      - "127.0.0.1:8081:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: rss-watch
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped

  # ホスト上のアプリ(:8080)の /actuator/prometheus を 15 秒間隔で scrape して時系列を保持する。
  # pull 型のため Prometheus が止まってもアプリ本体は無影響。
  prometheus:
    image: prom/prometheus:v3.13.1
    container_name: rss-watch-prometheus
    ports:
      # 管理 UI/API を LAN に露出しないようループバック限定で bind(kafka-ui と同方針)
      - "127.0.0.1:9090:9090"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      # 改善デプロイ前後(数週間〜数ヶ月スパン)の比較に足る保持期間
      - --storage.tsdb.retention.time=90d
    # アプリはホスト上(fat jar / bootRun)で :8080 を listen するため、
    # コンテナからホストへ届く名前 host.docker.internal を用意する。
    # cloudflared の network_mode: host は Linux ホスト前提だが、
    # この方式は macOS 開発機でも同じ設定のまま動く(prometheus/prometheus.yml の target で使用)。
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    restart: unless-stopped

  # トレースの受信(OTLP)・保存・検索。閲覧は Grafana(Tempo datasource)から行う。
  # 送信はアプリ側のバックグラウンドバッチのため、Tempo が止まってもアプリ本体は無影響。
  tempo:
    image: grafana/tempo:2.10.7
    container_name: rss-watch-tempo
    command: ["-config.file=/etc/tempo/tempo.yml"]
    ports:
      # OTLP/HTTP 受信。ホスト上のアプリ(systemd / bootRun)から届けばよいのでループバック限定で bind。
      # Tempo API(:3200)は publish しない(Grafana から compose 内 DNS tempo:3200 で届く)
      - "127.0.0.1:4318:4318"
    volumes:
      - ./tempo/tempo.yml:/etc/tempo/tempo.yml:ro
      # マウント先はイメージ既定のデータディレクトリ /var/tempo(uid 10001 所有)。
      # named volume が所有権を継承するため、非 root 実行のまま書き込める(tempo/tempo.yml 参照)
      - tempo-data:/var/tempo
    restart: unless-stopped

  # Prometheus のメトリクスを可視化するダッシュボード。
  # datasource とダッシュボードは provisioning でリポジトリ管理し、手動セットアップなしで起動直後から閲覧できる。
  grafana:
    image: grafana/grafana:12.3.8
    container_name: rss-watch-grafana
    ports:
      # 自宅サーバーは homepage が :3000 使用中のため 3001 に避ける(ループバック限定 bind は kafka-ui と同方針)
      - "127.0.0.1:3001:3000"
    environment:
      # 公開時は https://grafana.<ドメイン> を docker/.env で注入する
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:3001}
      # 閲覧はログイン不要(Viewer)。到達経路がループバック + Access 保護トンネルに限定されているため、
      # Access で人を絞り Grafana ログインを二重に求めない。編集(admin)だけパスワードで守る。
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      # docker/.env から注入(コミットしない)。grafana-data volume の初回初期化時にのみ反映されるため、
      # 初回 up -d の前に docker/.env を用意すること(以降の変更は grafana cli admin reset-admin-password)。
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      # 手元で加えたダッシュボード編集等を永続化する
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
      - tempo
    restart: unless-stopped

  # Cloudflare Tunnel コネクタ。自宅サーバーから Cloudflare へアウトバウンドでトンネルを張り、
  # 公開ホスト名(例 rss.example.com)→ ホストの :8080 を結ぶ(ポート開放不要)。
  # 公開ルーティング(Public Hostname → http://localhost:8080)と認証(Access)は
  # Cloudflare ダッシュボード側で設定する。ここはコネクタを常駐させるだけ。
  cloudflared:
    image: cloudflare/cloudflared:2025.6.1
    container_name: rss-watch-cloudflared
    # ローカル開発の `docker compose up -d` では起動させない。
    # 公開時のみ `--profile tunnel` を付けて明示的に起動する(トークン未設定での restart ループを避ける)。
    profiles: ["tunnel"]
    command: tunnel --no-autoupdate run
    environment:
      # named tunnel のトークン。リポジトリにはコミットせず docker/.env から注入する。
      # 注意: `--profile tunnel` 起動時にこの値が未設定/空だと cloudflared は認証に失敗し、
      # restart: unless-stopped により再起動ループになる。必ず docker/.env を用意してから起動する。
      # (`:?` によるフェイルファストは profile 無しのローカル開発 up -d まで壊すため使わない)
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    # アプリはホスト上(fat jar / bootRun)で :8080 を listen するため、
    # コンテナから見た localhost をホストに一致させる(Linux ホスト前提)。
    # これによりダッシュボードの Service `http://localhost:8080` がそのまま到達する。
    network_mode: host
    restart: unless-stopped

volumes:
  kafka-data:
  postgres-data:
  prometheus-data:
  grafana-data:
  tempo-data:
