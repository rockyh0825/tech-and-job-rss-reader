services:
  kafka:
    image: apache/kafka:3.9.1
    container_name: rss-watch-kafka
    ports:
      - "9092:9092"
    environment:
      # KRaft モード(シングルノードで broker + controller を兼任)
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      # INTERNAL: コンテナ間(kafka-ui など)/ EXTERNAL: ホスト上のアプリ(bootRun)
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      # シングルブローカーのためレプリケーション系はすべて 1
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      # topic は kafka-init が明示的に作成する(暗黙の自動作成は無効化)
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:29092 > /dev/null 2>&1",
        ]
      interval: 5s
      timeout: 10s
      retries: 12
    restart: unless-stopped

  # 起動時に topic rss.items を自動作成するワンショットジョブ
  # (key = フィード名のパーティショニングを観察できるよう 3 パーティション)
  kafka-init:
    image: apache/kafka:3.9.1
    container_name: rss-watch-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint:
      [
        "/opt/kafka/bin/kafka-topics.sh",
        "--bootstrap-server",
        "kafka:29092",
        "--create",
        "--if-not-exists",
        "--topic",
        "rss.items",
        "--partitions",
        "3",
        "--replication-factor",
        "1",
      ]
    restart: "no"

  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:v1.3.0
    container_name: rss-watch-kafka-ui
    ports:
      - "8081:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: rss-watch
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped

volumes:
  kafka-data:
