spring:
  application:
    name: tech-and-job-rss-reader
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      # sink 初回起動時に topic の先頭から catch-up する(要件 3.3)
      auto-offset-reset: earliest
  datasource:
    # デフォルトは docker/docker-compose.yml の postgres サービスのローカル値
    url: ${RSS_WATCH_DB_URL:jdbc:postgresql://localhost:5432/rsswatch}
    username: ${RSS_WATCH_DB_USER:rsswatch}
    password: ${RSS_WATCH_DB_PASSWORD:rsswatch}

server:
  port: 8080

rss-watch:
  topic: rss.items
  feeds-path: feeds.toml
  fetch:
    initial-delay-ms: 10000
    interval-ms: 900000
    connect-timeout-ms: 10000
    read-timeout-ms: 10000
