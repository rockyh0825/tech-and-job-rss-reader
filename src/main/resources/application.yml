spring:
  application:
    name: tech-and-job-rss-reader
  task:
    scheduling:
      # 既定は 1 本。FetchScheduler(15分毎の巡回)・DigestScheduler・CncfDigestScheduler が
      # 共有すると、ダイジェスト投稿(Claude 要約・OGP 取得・Discord へ記事数ぶんの POST)が
      # 長引く間ほかのジョブごと止まってしまう。3 者を独立させるため 3 本にする
      pool:
        size: 3
  http:
    client:
      # 自動構成の RestClient.Builder(ClaudeSummarizer / DiscordWebhookClient が使う)は
      # 既定でタイムアウトを持たない = 相手が黙るとスケジューラのスレッドを無期限に占有する。
      # 有限値を入れて必ず解放させる
      connect-timeout: 10s
      # Claude の要約 1 件(max-tokens: 256)の生成が収まる長さ。Discord への POST には過剰だが、
      # 掴んだまま止まるより短く諦める方がよい
      read-timeout: 30s
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      # sink 初回起動時に topic の先頭から catch-up する(要件 3.3)
      auto-offset-reset: earliest
  datasource:
    # デフォルトは docker/docker-compose.yml の postgres サービスのローカル値
    url: ${RSS_WATCH_DB_URL:jdbc:postgresql://localhost:5432/rsswatch}
    username: ${RSS_WATCH_DB_USER:rsswatch}
    password: ${RSS_WATCH_DB_PASSWORD:rsswatch}

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        # 最小限のみ明示(env/beans 等は晒さない)。Spring Boot 3 の既定は health のみだが、
        # 「これ以外は出さない」を設定として固定する
        include: health,prometheus
  metrics:
    distribution:
      percentiles-histogram:
        # Prometheus 側で histogram_quantile() により p95/p99 を計算するためのバケット公開。
        # アプリ側で分位数を焼き込む percentiles 設定は使わない(集約・時間範囲の変更に強いため)
        http.server.requests: true

rss-watch:
  topic: rss.items
  feeds-path: feeds.toml
  # 任意ハードニング(Phase 2): オリジンで Cloudflare Access の Cf-Access-Jwt-Assertion を検証する。
  # team-domain と aud を設定したときだけ有効化され、Access を経由しない全リクエスト(LAN 直アクセス含む)を 401 で拒否する。
  # ここにデフォルト値は置かない(未設定=未定義で @ConditionalOnProperty により無効=フィルタ未登録にするため)。
  # 有効化する場合の例(環境変数で渡す。relaxed binding):
  #   RSS_WATCH_ACCESS_TEAM_DOMAIN=myteam.cloudflareaccess.com
  #   RSS_WATCH_ACCESS_AUD=<Access アプリの AUD タグ>
  # access:
  #   team-domain: ...
  #   aud: ...
  fetch:
    initial-delay-ms: 10000
    interval-ms: 900000
    connect-timeout-ms: 10000
    read-timeout-ms: 10000
  notify:
    # Discord Webhook URL は環境変数 RSS_WATCH_NOTIFY_DISCORD_WEBHOOK_URL で渡す(Spring Boot の relaxed binding)。
    # ここには宣言しない(未設定=未定義のとき @ConditionalOnProperty で notify feature 一式を無効化=Bean 未登録
    # にして通常起動させるため。空文字デフォルトを置くと条件が真になってしまう)。
    # 配信時刻(cron)。既定は毎朝 8:00
    cron: "0 0 8 * * *"
    # 求人で言及された技術の集計窓(日)。求人は日々変わらないため取得窓は広めにとる
    window-days: 7
    # ダイジェストに載せる技術の上位件数(興味技術 → 未紹介・久しく紹介していない技術 → 言及求人数の多い順)。
    # ローテーションに期限はない:紹介済みの技術は未紹介の技術より常に後回しになるため、
    # 求人数の多い人気技術も全技術を一巡するまでは再登場しない(同じ技術ばかり連日出るのを避ける意図)
    tech-limit: 3
    # 各技術につき載せる関連記事の最大件数
    articles-per-tech: 3
    # 興味のある技術。ランキングより優先して先頭に載せる(枠は tech-limit と共通)。
    # categories: language / frontend / backend / mobile / database-middleware / cloud-infra / ml-ai
    # keywords:   キーワード辞書(Keywords.kt)の正規化名(大文字小文字は無視)。未知の名前は起動エラー。
    # 興味の件数が tech-limit 以上だと興味以外の技術はほぼ表示されなくなる点に注意。
    # 例:
    #   interests:
    #     categories: [cloud-infra]
    #     keywords: [Kotlin, Go]
    interests:
      categories: []
      keywords: []
    # 通知末尾に添えるサイト一覧への導線 URL
    site-url: "https://rss-watch.rocky-ha.com/"
    claude:
      # 既定は再現性のため dated スナップショット。undated エイリアスは将来挙動が変わり得る
      model: claude-haiku-4-5-20251001
      api-key: ${ANTHROPIC_API_KEY:}
      max-tokens: 256
    discord:
      max-retries: 2
    # CNCF ダイジェスト(issue #46)。CNCF フィード(feeds.toml の category = "cncf")の新着記事に
    # プロジェクト成熟度バッジを付けて専用チャンネルへ配信する。
    # Webhook URL は環境変数 RSS_WATCH_NOTIFY_CNCF_DISCORD_WEBHOOK_URL で渡し、ここには宣言しない
    # (未設定=未定義のとき @ConditionalOnProperty で CNCF 配信一式を無効化するため。既存側と同じ規則)。
    cncf:
      # 配信時刻。既存ダイジェスト(8:00)とずらしてスレッドの取り合いを避ける
      cron: "0 10 8 * * *"
      # 候補記事の取得窓(日)。投稿済み guid の永続除外があるため実質「未投稿の新着」になる
      window-days: 7
      # 1 回の配信に載せる記事の上限(初回有効化時に窓ぶんのバックログが一斉投稿されるのを防ぐ)
      max-articles: 8
      # 通知末尾に添える導線 URL(CNCF プロジェクト成熟度の一覧)
      cta-url: "https://www.cncf.io/projects/"
    ogp:
      # 記事ページから og:image を取りに行くときの上限。応答しない記事ページで
      # ダイジェスト投稿全体が止まらないよう、短めのタイムアウトと本文サイズ上限を置く。
      # timeout-ms は「1 リクエストあたり」で、1 記事あたりではない点に注意:
      # jsoup はリダイレクトのホップごとにタイムアウトを取り直すため、
      # 1 記事の解決は最悪 timeout-ms × 20(jsoup のリダイレクト上限)まで伸び得る
      timeout-ms: 5000
      max-body-bytes: 1048576
