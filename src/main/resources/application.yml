spring:
  application:
    name: tech-and-job-rss-reader
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

server:
  port: 8080

rss-watch:
  topic: rss.items
  feeds-path: feeds.toml
  fetch:
    initial-delay-ms: 10000
    interval-ms: 900000
    connect-timeout-ms: 10000
    read-timeout-ms: 10000
