spring:
  application:
    name: tech-and-job-rss-reader
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      # sink 初回起動時に topic の先頭から catch-up する(要件 3.3)
      auto-offset-reset: earliest
  datasource:
    url: jdbc:sqlite:${RSS_WATCH_DB_PATH:rss-watch.db}
    hikari:
      # SQLite は同時書き込みに弱いため、単一コネクションで直列化する
      maximum-pool-size: 1

server:
  port: 8080

rss-watch:
  topic: rss.items
  feeds-path: feeds.toml
  fetch:
    initial-delay-ms: 10000
    interval-ms: 900000
    connect-timeout-ms: 10000
    read-timeout-ms: 10000
