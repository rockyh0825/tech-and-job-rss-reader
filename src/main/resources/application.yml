spring:
  application:
    name: tech-and-job-rss-reader
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      # sink 初回起動時に topic の先頭から catch-up する(要件 3.3)
      auto-offset-reset: earliest
  datasource:
    # デフォルトは docker/docker-compose.yml の postgres サービスのローカル値
    url: ${RSS_WATCH_DB_URL:jdbc:postgresql://localhost:5432/rsswatch}
    username: ${RSS_WATCH_DB_USER:rsswatch}
    password: ${RSS_WATCH_DB_PASSWORD:rsswatch}

server:
  port: 8080

rss-watch:
  topic: rss.items
  feeds-path: feeds.toml
  # 任意ハードニング(Phase 2): オリジンで Cloudflare Access の Cf-Access-Jwt-Assertion を検証する。
  # team-domain と aud を設定したときだけ有効化され、Access を経由しない全リクエスト(LAN 直アクセス含む)を 401 で拒否する。
  # ここにデフォルト値は置かない(未設定=未定義で @ConditionalOnProperty により無効=フィルタ未登録にするため)。
  # 有効化する場合の例(環境変数で渡す。relaxed binding):
  #   RSS_WATCH_ACCESS_TEAM_DOMAIN=myteam.cloudflareaccess.com
  #   RSS_WATCH_ACCESS_AUD=<Access アプリの AUD タグ>
  # access:
  #   team-domain: ...
  #   aud: ...
  fetch:
    initial-delay-ms: 10000
    interval-ms: 900000
    connect-timeout-ms: 10000
    read-timeout-ms: 10000
  notify:
    # Discord Webhook URL は環境変数 RSS_WATCH_NOTIFY_DISCORD_WEBHOOK_URL で渡す(Spring Boot の relaxed binding)。
    # ここには宣言しない(未設定=未定義のとき @ConditionalOnProperty で notify feature 一式を無効化=Bean 未登録
    # にして通常起動させるため。空文字デフォルトを置くと条件が真になってしまう)。
    # 配信時刻(cron)。既定は毎朝 8:00
    cron: "0 0 8 * * *"
    # 求人で言及された技術の集計窓(日)。求人は日々変わらないため取得窓は広めにとる
    window-days: 7
    # ダイジェストに載せる技術の上位件数(興味技術 → 未紹介・久しく紹介していない技術 → 言及求人数の多い順)。
    # ローテーションに期限はない:紹介済みの技術は未紹介の技術より常に後回しになるため、
    # 求人数の多い人気技術も全技術を一巡するまでは再登場しない(同じ技術ばかり連日出るのを避ける意図)
    tech-limit: 3
    # 各技術につき載せる関連記事の最大件数
    articles-per-tech: 3
    # 興味のある技術。ランキングより優先して先頭に載せる(枠は tech-limit と共通)。
    # categories: language / frontend / backend / mobile / database-middleware / cloud-infra / ml-ai
    # keywords:   キーワード辞書(Keywords.kt)の正規化名(大文字小文字は無視)。未知の名前は起動エラー。
    # 興味の件数が tech-limit 以上だと興味以外の技術はほぼ表示されなくなる点に注意。
    # 例:
    #   interests:
    #     categories: [cloud-infra]
    #     keywords: [Kotlin, Go]
    interests:
      categories: []
      keywords: []
    # 通知末尾に添えるサイト一覧への導線 URL
    site-url: "https://rss-watch.rocky-ha.com/"
    claude:
      # 既定は再現性のため dated スナップショット。undated エイリアスは将来挙動が変わり得る
      model: claude-haiku-4-5-20251001
      api-key: ${ANTHROPIC_API_KEY:}
      max-tokens: 256
    discord:
      max-retries: 2
